# Netlify deployment. The app is fully static — every heavy operation
# (neural TTS, modulation, analysis) runs in the visitor's own browser,
# so there is no server to scale and hosting stays flat-cost regardless
# of user count.
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "shield"
  path = "/api/*"

[[edge_functions]]
  function = "flick-inject"
  path = "/*"

# Flick chat proxy — must sit above the SPA fallback.
[[redirects]]
  from = "/api/flick-chat"
  to = "/.netlify/functions/flick-chat"
  status = 200

# Single-page app: unknown paths fall through to index.html so deep links
# and OAuth redirects resolve instead of 404ing.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), payment=(self), usb=(), midi=(self)"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    X-Permitted-Cross-Domain-Policies = "none"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; media-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://api.elevenlabs.io https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net https://esm.sh https://api.x.ai; upgrade-insecure-requests"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Resource-Policy = "same-origin"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
