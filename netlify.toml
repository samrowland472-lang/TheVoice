# Netlify deployment. The app is fully static — every heavy operation
# (neural TTS, modulation, analysis) runs in the visitor's own browser,
# so there is no server to scale and hosting stays flat-cost regardless
# of user count.
[build]
  publish = "."

# Existing files (js, css, wav) are served as-is. The catch-all is last
# and is NOT forced, so it only covers unknown paths / OAuth redirects.
[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), midi=(self)"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60"
