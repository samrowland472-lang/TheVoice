# Netlify deployment. The app is fully static — every heavy operation
# (neural TTS, modulation, analysis) runs in the visitor's own browser.
# Flick chat is the only server function (optional; needs XAI_API_KEY).
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "flick-inject"
  path = "/*"

[[edge_functions]]
  function = "shield"
  path = "/api/*"

[[redirects]]
  from = "/api/flick-chat"
  to = "/.netlify/functions/flick-chat"
  status = 200
  force = true

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "microphone=(self), midi=(self), camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' blob: https://cdn.jsdelivr.net https://esm.sh https://fonts.googleapis.com https://fonts.gstatic.com https://api.elevenlabs.io https://*.supabase.co wss://*.supabase.co https://huggingface.co https://*.huggingface.co https://*.hf.co; upgrade-insecure-requests"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
