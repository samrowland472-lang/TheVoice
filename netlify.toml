# Netlify deployment. Only the vanilla studio is published.
# aether/, animate/, and design/ are nested Grok workspaces — never ship them.
# Flick chat is the only server function (optional; needs XAI_API_KEY).
[build]
  command = "bash scripts/publish-spa.sh"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "flick-inject"
  path = "/*"

[[edge_functions]]
  function = "shield"
  path = "/api/*"

[[redirects]]
  from = "/api/flick-chat"
  to = "/.netlify/functions/flick-chat"
  status = 200
  force = true

# Missing /js/* must 404 — never fall through to index.html (browsers then
# execute HTML as a script and the studio dies).
[[redirects]]
  from = "/js/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/aether/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/animate/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/design/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cross-Origin-Opener-Policy = "same-origin-allow-popups"
    Permissions-Policy = "microphone=(self), midi=(self), camera=(), geolocation=(), payment=(), usb=(), interest-cohort=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'self' https://grok.com https://*.grok.com https://x.com https://*.x.com; object-src 'none'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' https://fonts.gstatic.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://esm.sh https://grok.com; worker-src 'self' blob: https://cdn.jsdelivr.net; connect-src 'self' blob: https://cdn.jsdelivr.net https://esm.sh https://fonts.googleapis.com https://fonts.gstatic.com https://api.elevenlabs.io https://*.supabase.co wss://*.supabase.co https://huggingface.co https://*.huggingface.co https://*.hf.co https://api.x.ai; upgrade-insecure-requests"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
    Content-Type = "text/javascript; charset=utf-8"
