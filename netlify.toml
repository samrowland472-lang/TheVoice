# Netlify deployment. The app is fully static — every heavy operation
# (neural TTS, modulation, analysis) runs in the visitor's own browser.
# Flick chat is the only server function (optional; needs XAI_API_KEY).
[build]
  publish = "."

[functions]
  directory = "netlify/functions"

[[edge_functions]]
  function = "flick-inject"
  path = "/*"

[[edge_functions]]
  function = "shield"
  path = "/api/*"

[[redirects]]
  from = "/api/flick-chat"
  to = "/.netlify/functions/flick-chat"
  status = 200
  force = true

[[redirects]]
  from = "/js/*"
  to = "/js/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=(), midi=(self)"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=60"
